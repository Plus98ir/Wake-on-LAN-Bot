<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOL Agent</title>
<link rel="icon" href="/icon.png">
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#e6edf3;--mut:#8b949e;--acc:#2f81f7;--ok:#3fb950;--bad:#f85149;--warn:#d29922;
  --font:"Segoe UI",Tahoma,"Vazirmatn",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--font)}
header{display:flex;align-items:center;gap:12px;padding:16px 32px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
header .sub{color:var(--mut);font-size:13px}
main{width:100%;padding:24px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h2{font-size:16px;margin:0 0 12px}
.wide{grid-column:1/-1}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dt{color:var(--mut)} dd{margin:0;word-break:break-all;direction:ltr;text-align:start}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
label{display:block;margin:12px 0 4px;font-weight:600}
.help{color:var(--mut);font-size:13px;margin-top:3px}
input[type=text],textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0b0f14;color:var(--text);font:15px var(--font);direction:ltr}
textarea{height:64px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:#21262d;color:var(--text);font:600 15px var(--font);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc)}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}
details{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
summary{cursor:pointer;color:var(--mut);font-weight:600}
pre{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:220px;max-height:420px;overflow:auto;direction:ltr;text-align:left;font:13px/1.5 Consolas,monospace;white-space:pre-wrap;margin:0}
ol{margin:12px 0 0;padding-inline-start:20px} li{margin:6px 0}
.lead{font-size:16px;font-weight:600;margin-bottom:10px}
.parts{display:grid;gap:6px}
.parts div{display:flex;gap:10px;align-items:baseline;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
header img{width:40px;height:40px}
a{color:var(--acc)}
.applist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 10px}
.applist label{display:flex;align-items:center;gap:8px;margin:0;font-weight:400;padding:4px 6px;border-radius:6px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.applist label:hover{background:#21262d}
.applist input{flex:none}
.radios{display:flex;gap:18px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;margin:4px 0;font-weight:400}
.addrow{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-top:8px}
.lang{background:none;border:1px solid var(--line);padding:6px 12px;font-size:13px}
@media (max-width:700px){header,main{padding-left:16px;padding-right:16px} main{grid-template-columns:1fr} .addrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <img src="/icon.png" alt="">
  <div style="flex:1">
    <h1 data-t="title"></h1>
    <div class="sub" data-t="subtitle"></div>
  </div>
  <button class="lang" id="lang">English</button>
</header>
<main>
  <section class="card">
    <h2 data-t="sys"></h2>
    <dl id="sys"><dt>…</dt><dd></dd></dl>
    <div class="row"><button id="refresh" data-t="refresh"></button></div>
  </section>

  <section class="card">
    <h2 data-t="pair"></h2>
    <label for="code" data-t="code"></label>
    <input type="text" id="code" placeholder="1.2.3.4:8790/ABCD-2345" autocomplete="off">
    <div class="help" data-t="codeHelp"></div>
    <label for="name" data-t="name"></label>
    <input type="text" id="name">
    <div class="help" data-t="nameHelp"></div>
    <label for="cdir" data-t="cdir"></label>
    <input type="text" id="cdir">
    <div class="help" data-t="cdirHelp"></div>
    <div class="chk"><input type="checkbox" id="lock" checked><label for="lock" style="margin:0;font-weight:400" data-t="lock"></label></div>
    <details>
      <summary data-t="adv"></summary>
      <label for="wake" data-t="wake"></label>
      <input type="text" id="wake" placeholder="myhome.ddns.net">
      <div class="help" data-t="wakeHelp"></div>
      <label for="xkey" data-t="xkey"></label>
      <textarea id="xkey" placeholder="ssh-ed25519 AAAA... laptop"></textarea>
      <div class="help" data-t="xkeyHelp"></div>
    </details>
    <div class="row">
      <button class="pri" id="install" data-t="install"></button>
      <button id="csetup" data-t="csetup"></button>
      <button class="danger" id="uninstall" data-t="uninstall"></button>
    </div>
  </section>

  <section class="card">
    <h2 data-t="appsT"></h2>
    <label data-t="cmode"></label>
    <div class="radios">
      <label><input type="radio" name="cmode" value="hidden" checked><span data-t="cmHidden"></span></label>
      <label><input type="radio" name="cmode" value="vscode"><span data-t="cmVscode"></span></label>
    </div>
    <div class="help" data-t="cmHelp"></div>
    <label for="afilter"><span data-t="appsL"></span> <span id="acount" style="color:var(--mut);font-weight:400"></span></label>
    <input type="text" id="afilter" autocomplete="off">
    <div class="applist" id="alist"></div>
    <div class="help" data-t="appsHelp"></div>
    <div class="addrow">
      <input type="text" id="aname" autocomplete="off">
      <input type="text" id="apath" placeholder="C:\Program Files\App\app.exe" autocomplete="off">
      <button id="aadd" data-t="aadd"></button>
    </div>
    <div class="row"><button class="pri" id="save" data-t="save"></button></div>
    <div class="help" data-t="saveHelp"></div>
  </section>

  <section class="card">
    <h2 data-t="manual"></h2>
    <div class="lead" data-t="lead"></div>
    <div class="parts">
      <div><b>📱</b><span data-t="p1"></span></div>
      <div><b>💻</b><span data-t="p2"></span></div>
      <div><b>🖧</b><span data-t="p3"></span></div>
    </div>
    <ol>
      <li data-t="m1"></li>
      <li data-t="m2"></li>
      <li data-t="m3"></li>
      <li data-t="m4"></li>
      <li data-t="m5"></li>
      <li data-t="m6"></li>
    </ol>
    <div class="help" data-t="more"></div>
  </section>

  <section class="card wide">
    <h2 data-t="log"></h2>
    <pre id="out"></pre>
  </section>
</main>

  sys:"This PC",refresh:"Check again",pair:"Link to the bot",code:"Pair code",codeHelp:"In the bot press ➕ Add PC and paste the code here. One use, valid 15 minutes.",

let lang=localStorage.getItem("lang")||"fa", info=null;
const $=id=>document.getElementById(id);
function tr(){
  const t=L[lang];document.documentElement.lang=lang;document.documentElement.dir=lang=="fa"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=t[e.dataset.t]);
  $("lang").textContent=lang=="fa"?"English":"فارسی";$("aname").placeholder=t.aname;renderSys();
}
function renderSys(){
  if(!info)return;const t=L[lang],k=t.k;
  const v=(key,val)=>{
    if(typeof val=="boolean")return `<span class="${val?"ok":"bad"}">${val?"✓ "+t.yes:"✗ "+t.no}</span>`;
    if(val===""||val==null)return `<span class="warn">—</span>`;
    if(key=="wol")return `<span class="${val=="Enabled"?"ok":"bad"}">${val}</span>`;
    if(key=="sshd")return `<span class="${val=="Running"?"ok":"warn"}">${val}</span>`;
    return String(val).replace(/</g,"&lt;");
  };
  let h="";for(const key of Object.keys(k)){let val=info[key];if(key=="paired"&&info.paired)val=true;
    h+=`<dt>${k[key]}</dt><dd>${v(key,val)}${key=="paired"&&info.paired?` <span style="color:var(--mut)">(${info.server}, port ${info.port})</span>`:""}</dd>`;}
  $("sys").innerHTML=h;
}
// app picker: every known app (Start menu + saved + added by hand); the ticked ones become bot buttons
let apps=[],picked=new Set(),appsInit=false;
const akey=a=>(a.path+"|"+(a.args||"")).toLowerCase();
function initApps(){
  const seen=new Set(apps.map(akey));
  const add=a=>{const k=akey(a);if(!seen.has(k)){seen.add(k);apps.push({name:String(a.name||""),path:a.path,args:a.args||""});}return k;};
  (info.startApps||[]).forEach(add);
  if(!appsInit){
    appsInit=true;
    if((info.apps||[]).length)info.apps.forEach(a=>picked.add(add(a)));
    else apps.filter(a=>a.path&&(a.path==info.v2rayn||a.path==info.vscode)).forEach(a=>picked.add(akey(a)));
    document.querySelectorAll("input[name=cmode]").forEach(r=>r.checked=r.value==(info.claudeMode||"hidden"));
  }
  apps.sort((a,b)=>a.name.localeCompare(b.name));renderApps();
}
function renderApps(){
  const f=$("afilter").value.trim().toLowerCase(),esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  const row=(a,i)=>`<label title="${esc(a.path+" "+a.args)}"><input type="checkbox" data-i="${i}" ${picked.has(akey(a))?"checked":""}>${esc(a.name)}</label>`;
  // ticked apps first, the rest filtered by the search box
  $("alist").innerHTML=apps.map((a,i)=>picked.has(akey(a))?row(a,i):"").join("")+
    apps.map((a,i)=>!picked.has(akey(a))&&(!f||a.name.toLowerCase().includes(f))?row(a,i):"").join("");
  $("acount").textContent=`(${picked.size}/12)`;
}
$("alist").onchange=e=>{const a=apps[e.target.dataset.i],k=akey(a);
  if(e.target.checked){if(picked.size>=12){e.target.checked=false;alert(L[lang].tooMany);return;}picked.add(k);}else picked.delete(k);
  $("acount").textContent=`(${picked.size}/12)`;};
$("afilter").oninput=renderApps;
// adds the typed exe; false (with a message) if the path is not usable
function addCustom(){
  const path=$("apath").value.trim().replace(/^"|"$/g,"");if(!/\.exe$/i.test(path)){alert(L[lang].needPath);return false;}
  const name=$("aname").value.trim()||path.split("\\").pop().replace(/\.exe$/i,"");
  const a={name,path,args:""};
  if(!picked.has(akey(a))&&picked.size>=12){alert(L[lang].tooMany);return false;}
  if(!apps.some(x=>akey(x)==akey(a)))apps.push(a);picked.add(akey(a));
  $("aname").value=$("apath").value="";renderApps();return true;
}
$("aadd").onclick=addCustom;
$("apath").onkeydown=e=>{if(e.key=="Enter")addCustom();};
function settings(){
  // a path typed without pressing Add still counts
  if($("apath").value.trim()&&!addCustom())return null;
  return {claudeDir:$("cdir").value.trim(),claudeMode:document.querySelector("input[name=cmode]:checked").value,
    apps:apps.filter(a=>picked.has(akey(a))).map(a=>({name:a.name,path:a.path,args:a.args}))};
}
async function detect(){
  $("sys").innerHTML=`<dt>${L[lang].running}</dt><dd></dd>`;
  try{info=await (await fetch("/api/detect")).json();if(!$("name").value)$("name").value=info.name;if(!$("cdir").value)$("cdir").value=info.claudeDir||"";renderSys();initApps();}
  catch(e){$("sys").innerHTML=`<dt class="bad">Error</dt><dd>${e}</dd>`;}
}
async function run(body){
  $("install").disabled=$("uninstall").disabled=$("save").disabled=true;$("out").textContent=L[lang].running+"\n";
  try{
    const r=await fetch("/api/run",{method:"POST",body:JSON.stringify(body)});
    const rd=r.body.getReader(),dec=new TextDecoder();
    for(;;){const {done,value}=await rd.read();if(done)break;$("out").textContent+=dec.decode(value,{stream:true});$("out").scrollTop=1e9;}
  }catch(e){$("out").textContent+="\nERROR: "+e;}
  $("install").disabled=$("uninstall").disabled=$("save").disabled=false;detect();
}
$("install").onclick=()=>{const code=$("code").value.trim();if(!code){alert(L[lang].needCode);return;}
  const st=settings();if(!st)return;
  run({action:"install",code,name:$("name").value.trim(),wakeHost:$("wake").value.trim(),extraKey:$("xkey").value.trim(),noLock:!$("lock").checked,...st});};
$("save").onclick=()=>{if(!info||!info.paired){alert(L[lang].notPaired);return;}const st=settings();if(st)run({action:"update",...st});};
$("csetup").onclick=()=>run({action:"claude-setup"});
$("uninstall").onclick=()=>{if(confirm(L[lang].confirmUn))run({action:"uninstall"});};
$("refresh").onclick=detect;
$("lang").onclick=()=>{lang=lang=="fa"?"en":"fa";try{localStorage.setItem("lang",lang)}catch(e){};tr();};
setInterval(()=>fetch("/api/ping").catch(()=>{}),3000);fetch("/api/ping");
tr();detect();
</script>
</body>
</html>
