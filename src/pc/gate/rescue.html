<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wolbot</title>
<style>
:root{--fg:#fff;--mut:#ffd0cc;--box:rgba(0,0,0,.28);--line:rgba(255,255,255,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 50% 30%,#c62828,#7f0000 70%,#4a0000);color:var(--fg);
  font:18px/1.7 "Segoe UI",Tahoma,"Vazirmatn",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 32px}
header b{font-size:18px;letter-spacing:.5px}
.lang{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}
main{flex:1;display:grid;place-items:center;width:100%;padding:24px 32px;text-align:center}
.icon{font-size:84px;line-height:1}
h1{font-size:34px;margin:14px 0 6px}
p{color:var(--mut);margin:0 0 22px}
form{display:flex;flex-direction:column;gap:12px;align-items:center}
input{width:min(460px,90vw);padding:14px 18px;border-radius:12px;border:1px solid var(--line);background:var(--box);color:#fff;font:inherit;text-align:center}
input::placeholder{color:#ffb3ad}
button.go{width:min(460px,90vw);padding:14px;border-radius:12px;border:0;background:#fff;color:#8b0000;font:inherit;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.6}
#msg{min-height:1.7em;margin-top:16px;font-weight:600}
.ok{color:#b9f6ca}
@media(max-width:600px){header,main{padding-left:16px;padding-right:16px}h1{font-size:26px}}
</style>
</head>
<body>
<header><b>🛡 wolbot</b><button class="lang" id="lang">English</button></header>
<main><div>
  <div class="icon" id="icon">🛑</div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <form id="f" class="hide">
    <input type="password" id="p1" autocomplete="off" autofocus>
    <input type="password" id="p2" autocomplete="off">
    <button class="go" id="go"></button>
  </form>
  <div id="msg"></div>
</div></main>
<script>
const T = {
  fa: {lang: "English",
    locked: ["کیل‌سوییچ زده شده", "همه‌ی ارتباط‌های این کامپیوتر قطع است. رمز بازیابی را بزن؛ بعد باید با اثر انگشت در اپ گوشی تأیید کنی."],
    nopass: ["کیل‌سوییچ زده شده", "رمز بازیابی تعریف نشده. در ترمینال ادمین: C:\\ProgramData\\wol-agent\\wol-unkill.ps1"],
    network: ["در حال وصل شدن...", "اینترنت برمی‌گردد و درخواست به اپ گوشی فرستاده می‌شود."],
    waiting: ["📱 در اپ گوشی تأیید کن", "در اپ wolbot روی «باز کردن قفل» بزن و اثر انگشت بده. تا ۳ دقیقه وقت داری."],
    done: ["✅ باز شد", "همه‌ی ارتباط‌ها برگشت. این صفحه خودش بسته می‌شود."],
    setup: ["تعریف رمز بازیابی", "این رمز جدا از پسورد ویندوز است و فقط وقتی کیل‌سوییچ زده شد خواسته می‌شود. حداقل ۸ حرف."],
    saved: ["✅ رمز ذخیره شد", "این پنجره بسته می‌شود."],
    p1: "رمز بازیابی", p2: "تکرار رمز", go: "ادامه", save: "ذخیره", mismatch: "دو رمز یکی نیستند"},
  en: {lang: "فارسی",
    locked: ["Kill switch is on", "Every connection of this PC is cut. Type your recovery password, then approve with your fingerprint in the phone app."],
    nopass: ["Kill switch is on", "No recovery password is set. In an admin terminal: C:\\ProgramData\\wol-agent\\wol-unkill.ps1"],
    network: ["Connecting...", "Internet comes back and a request goes to your phone app."],
    waiting: ["📱 Approve it in the phone app", "In the wolbot app press \"Unlock\" and touch the sensor. You have 3 minutes."],
    done: ["✅ Unlocked", "Every connection is back. This screen closes by itself."],
    setup: ["Set the recovery password", "Separate from your Windows password; asked only after a kill switch. At least 8 characters."],
    saved: ["✅ Password saved", "This window closes."],
    p1: "Recovery password", p2: "Repeat it", go: "Continue", save: "Save", mismatch: "The two passwords differ"}
};
let L = "fa";
try { L = localStorage.getItem("lang") || (navigator.language.startsWith("fa") ? "fa" : "en"); } catch (e) {}
const $ = id => document.getElementById(id);
let st = {state: "locked", msg: ""};
function paint() {
  const t = T[L], s = t[st.state] || t.locked;
  document.documentElement.lang = L; document.documentElement.dir = L === "fa" ? "rtl" : "ltr";
  $("lang").textContent = t.lang; $("title").textContent = s[0]; $("sub").textContent = s[1];
  const form = st.state === "locked" || st.state === "setup";
  $("f").style.display = form ? "" : "none";
  $("p2").style.display = st.state === "setup" ? "" : "none";
  $("p1").placeholder = t.p1; $("p2").placeholder = t.p2;
  $("go").textContent = st.state === "setup" ? t.save : t.go;
  $("icon").textContent = st.state === "done" || st.state === "saved" ? "✅" : st.state === "setup" ? "🔑" : "🛑";
  $("msg").textContent = st.msg || ""; $("msg").className = st.state === "done" ? "ok" : "";
}
async function poll() {
  try { const r = await fetch("/api/status", {headers: {"X-Wolbot": "1"}}); st = await r.json(); paint(); } catch (e) {}
}
$("f").onsubmit = async e => {
  e.preventDefault();
  const t = T[L];
  if (st.state === "setup" && $("p1").value !== $("p2").value) { st.msg = t.mismatch; return paint(); }
  $("go").disabled = true;
  try {
    const r = await fetch(st.state === "setup" ? "/api/setpass" : "/api/pass", {method: "POST",
      headers: {"Content-Type": "application/json", "X-Wolbot": "1"}, body: JSON.stringify({password: $("p1").value})});
    const j = await r.json(); st = j; $("p1").value = ""; $("p2").value = "";
  } catch (e) { st.msg = e.message; }
  $("go").disabled = false; paint();
};
$("lang").onclick = () => { L = L === "fa" ? "en" : "fa"; try { localStorage.setItem("lang", L); } catch (e) {} paint(); };
paint(); poll(); setInterval(poll, 2000);
</script>
</body>
</html>
